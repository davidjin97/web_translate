<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lingo · 双语网页翻译</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="popup-header">
    <div class="brand"><img src="assets/logo.svg" width="36" height="36" alt=""><span>Lingo<span class="brand-caption">双语网页翻译</span></span></div>
    <button class="icon-button" id="open-options" title="打开设置" aria-label="打开设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>
  <main class="popup-main">
    <section class="page-card"><span class="eyebrow"><span class="status-dot"></span> 当前网页</span><strong id="page-title">正在读取网页…</strong><span id="page-host" class="muted truncate"></span></section>
    <div class="field"><label for="provider">翻译服务</label><select id="provider"><option value="google">Google 翻译 · 免 Key</option><option value="google-cloud">Google Cloud · 官方 API</option><option value="openai">OpenAI · 自定义模型</option></select></div>
    <div class="language-pair"><div class="field"><label for="sourceLanguage">源语言</label><select id="sourceLanguage"></select></div><span class="language-arrow" aria-hidden="true">→</span><div class="field"><label for="targetLanguage">目标语言</label><select id="targetLanguage"></select></div></div>
    <div class="reading-mode"><span class="mode-icon">Aa</span><div><strong>双语对照阅读</strong><span>译文插入原文下方，保留网页布局</span></div><span class="checkmark">✓</span></div>
    <button id="translate" class="button primary full" disabled><span id="translate-label">翻译此页</span><span aria-hidden="true">↗</span></button>
    <div id="progress" class="progress" hidden><span id="progress-text"></span><button id="retry" class="text-button" hidden>重试失败段落</button></div>
    <p id="message" class="message" role="status" hidden></p>
    <p class="popup-hint" id="provider-hint">免 Key 接口仅供试用，需能访问 Google。</p>
  </main>
  <footer class="popup-footer"><span>阅读世界，不必切换。</span><kbd>⌥ / Alt + T</kbd></footer>
  <script type="module" src="popup.js"></script>
</body></html>
